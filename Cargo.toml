[package]
name = "silvia-art-cms-auth"
version = "0.1.0"
edition = "2021"
description = "Lightweight Cloudflare Worker in Rust implementing the GitHub OAuth 2.0 exchange protocol for Sveltia CMS"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "js"] }
worker = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
